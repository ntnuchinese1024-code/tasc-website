name: 每日重建官網

# 為什麼需要這個排程
# ------------------------------------------------------------------
# 官網是靜態站：「哪些課程算近期、哪些算已結束」是在建置那一刻用當天日期
# 算好、寫死在 HTML 裡的。沒有重建，分類就不會隨時間改變——
# 一堂昨天辦完的課會一直掛在「近期活動」，直到有人剛好發布了什麼才被重算。
#
# 報名系統在秘書處發布活動時會自動觸發重建，但那是「有人操作」才會發生。
# 學會可能兩個月沒開新課，這段期間就沒有任何東西推動官網更新。
# 所以再加一個與人無關的每日重建。
#
# 順帶也會更新剩餘名額與報名截止狀態。

on:
  schedule:
    # 台北時間每天 00:30（UTC 16:30）。
    # 選在剛過午夜，是因為「昨天辦完的課」在午夜那一刻才變成過去式，
    # 這時候重建，過期課程當天一早就已經歸位。
    - cron: '30 16 * * *'

  # 讓 Actions 頁面出現「Run workflow」按鈕，需要時可以手動跑一次。
  workflow_dispatch:

# 同時只跑一個，避免手動與排程撞在一起。
concurrency:
  group: daily-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: 通知 Cloudflare 重新建置
        env:
          # Cloudflare 的 Deploy Hook 網址。
          # 這個 repo 是公開的，網址絕對不能寫在檔案裡——
          # 拿到它的人就能無限觸發建置。存成 repository secret。
          # 設定位置：Settings → Secrets and variables → Actions → New repository secret
          # 名稱：DEPLOY_HOOK_URL
          HOOK: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${HOOK:-}" ]; then
            echo "::error::找不到 DEPLOY_HOOK_URL。"
            echo "請到 Settings → Secrets and variables → Actions 新增一個名為"
            echo "DEPLOY_HOOK_URL 的 repository secret，值是 Cloudflare 的 Deploy Hook 網址"
            echo "（Workers & Pages → 你的 Worker → Settings → Builds → Deploy Hooks）。"
            exit 1
          fi

          # -f 讓 4xx/5xx 直接視為失敗，才不會「回了錯誤卻顯示成功」
          CODE=$(curl -sS -X POST -o /tmp/response.txt -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"reason":"每日自動重建：讓過期課程歸位、名額與截止狀態更新"}' \
            "$HOOK")

          echo "Cloudflare 回應 HTTP $CODE"
          head -c 500 /tmp/response.txt || true
          echo

          case "$CODE" in
            2*)
              echo "已送出重建請求。Cloudflare 通常需要 1–3 分鐘完成建置。"
              ;;
            404)
              echo "::error::Deploy Hook 網址無效（404）。可能是 hook 被刪掉，或網址複製不完整。"
              exit 1
              ;;
            429)
              echo "::error::觸發過於頻繁被限流。Cloudflare 的上限是每分鐘 10 次。"
              exit 1
              ;;
            *)
              echo "::error::觸發失敗，HTTP $CODE。"
              exit 1
              ;;
          esac
